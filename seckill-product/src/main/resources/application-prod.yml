spring:
  profiles: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://prod-db-host:3306/seckill?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4}
    username: ${DB_USER:seckill}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST:prod-redis-host}
    port: ${REDIS_PORT:6379}

server:
  port: ${PRODUCT_PORT:8081}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:prod-kafka-1:9092}

# Logging and monitoring can be controlled by env vars or Nacos
logging:
  level:
    root: ${LOG_LEVEL:INFO}

# Use externalized config center (Nacos) if available. The bootstrap file configures Nacos connection.
