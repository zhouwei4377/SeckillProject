spring:
  application:
    name: seckill-payment
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: seckill
      config:
        server-addr: 127.0.0.1:8848
        namespace: seckill
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/seckill_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 2000
    jedis:
      pool:
        max-active: 100
        max-idle: 50
        min-idle: 10
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      acks: all
      retries: 3

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.seckill.payment.entity
  global-config:
    db-config:
      id-type: auto

server:
  port: 8083
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.seckill: DEBUG
  file:
    name: logs/seckill-payment.log
