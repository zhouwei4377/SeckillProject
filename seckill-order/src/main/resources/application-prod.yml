spring:
  profiles: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://prod-db-host:3306/seckill?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4}
    username: ${DB_USER:seckill}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST:prod-redis-host}
    port: ${REDIS_PORT:6379}

server:
  port: ${ORDER_PORT:8082}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:prod-kafka-1:9092}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
